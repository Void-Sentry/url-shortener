---
# Source: dragonfly/templates/manager/manager-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dragonfly-manager
  namespace: "dragonfly-system"
  labels:
    app: dragonfly
    chart: dragonfly-1.3.19
    release: dragonfly
    heritage: Helm
    component: manager
data:
  manager.yaml: |-
    server:
      rest:
        addr: :8080
      grpc:
        advertiseIP: 
        port:
          start: 65003
          end: 65003
      workHome: 
      logDir: 
      cacheDir: 
      pluginDir: 
    auth:
      jwt:
        key: ZHJhZ29uZmx5Cg==
        maxRefresh: 48h
        realm: Dragonfly
        timeout: 48h
    database:
      mysql:
        user: dragonfly
        password: dragonfly
        host: dragonfly-mysql.dragonfly-system.svc.cluster.local
        port: 3306
        dbname: manager
        migrate: true
      redis:
        addrs:
        - dragonfly-redis-master.dragonfly-system.svc.cluster.local:6379
        password: dragonfly
    cache:
      local:
        size: 30000
        ttl: 3m
      redis:
        ttl: 5m
    job:
      gc:
        interval: 3h
        ttl: 6h
      preheat:
        registryTimeout: 1m
        tls:
          insecureSkipVerify: false
      rateLimit:
        capacity: 10
        fillInterval: 1m
        quantum: 10
      syncPeers:
        interval: 24h
        timeout: 10m
    network:
      enableIPv6: false
    metrics:
      enable: true
      addr: ":8000"
    console: true
    verbose: false
