---
# Source: cockroachdb/templates/cronjob-client-node-certSelfSigner.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cockroachdb-rotate-self-signer-client
  namespace: "cockroachdb-system"
  labels:
    helm.sh/chart: cockroachdb-16.0.6
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: "cockroachdb"
    app.kubernetes.io/managed-by: "Helm"
spec:
  schedule: 0 0 */26 * *
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
        spec:
          restartPolicy: Never
          containers:
          - name: cert-rotate-job
            image: "gcr.io/cockroachlabs-helm-charts/cockroach-self-signer-cert:1.7"
            imagePullPolicy: "IfNotPresent"
            args:
            - rotate
            - --ca-duration=43800h
            - --ca-expiry=648h
            - --client
            - --client-duration=672h
            - --client-expiry=48h
            - --node
            - --node-duration=8760h
            - --node-expiry=168h
            - --node-client-cron=0 0 */26 * *
            - --readiness-wait=30s
            - --pod-update-timeout=2m
            env:
            - name: STATEFULSET_NAME
              value: cockroachdb
            - name: NAMESPACE
              value: cockroachdb-system
            - name: CLUSTER_DOMAIN
              value: cluster.local
          serviceAccountName: cockroachdb-rotate-self-signer
